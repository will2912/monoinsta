name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -x

            echo "=== Loading NVM ==="
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"

            echo "=== Versions ==="
            node --version
            npm --version
            pm2 --version

            echo "=== Changing directory ==="
            cd /home/ubuntu/monoinsta/apps/ig
            pwd

            echo "=== Git pull ==="
            git pull origin main

            echo "=== NPM install ==="
            npm install

            echo "=== Build ==="
            npm run build

            echo "=== PM2 restart ==="
            pm2 restart insta

            echo "=== DEPLOYMENT COMPLETE ==="